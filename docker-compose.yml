services:
  site:
    image: ghcr.io/stayingfalse/stayingfalse:latest
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Optional: pull fresh content from the repo without rebuilding the image.
      CONTENT_URL: https://raw.githubusercontent.com/Stayingfalse/Stayingfalse/main/content/profile.json
      REFRESH_MINUTES: "10"
