name: Build site image

on:
  push:
    branches: [main]
    paths: [content/**, scripts/**, site/**, Dockerfile, package.json]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/stayingfalse/stayingfalse:latest
            ghcr.io/stayingfalse/stayingfalse:${{ github.sha }}
